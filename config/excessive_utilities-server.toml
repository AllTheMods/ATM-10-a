	[grid_power.gp_usage]
		#The amount of GP to be occupied while a piece of Red Coal is burning in a Furnace.
		# Default: 4.0
		# Range: 0.0 ~ 1.7976931348623157E308
		redCoalGpCost = 4.0
		#How many times longer should a piece of Red Coal burn in a Furnace compared to regular coal.
		# Default: 8.0
		# Range: 0.0 ~ 1.7976931348623157E308
		redCoalBurnTimeMultiplier = 8.0
		#The multiplier applied to the GP cost of Speed Upgrades.
		#Note that you can also change the GP cost formula directly using KubeJS.
		# Default: 1.0
		# Range: 0.0 ~ 1.7976931348623157E308
		speedUpgradeGpCostMultiplier = 1.0
		#The amount of GP to be occupied while using a Chicken Wing Ring.
		# Default: 1.0
		# Range: 0.0 ~ 1.7976931348623157E308
		chickenWingRingGpCost = 1.0
		#The amount of GP to be occupied while using a Flying Squid Ring.
		# Default: 16.0
		# Range: 0.0 ~ 1.7976931348623157E308
		flyingSquidRingGpCost = 16.0
		#The amount of GP to be occupied while flying with an Angel Ring.
		# Default: 64.0
		# Range: 0.0 ~ 1.7976931348623157E308
		angelRingGpCost = 64.0
		#The amount of GP to be occupied per connection while using a Wireless FE Transmitter.
		# Default: 1.0
		# Range: 0.0 ~ 1.7976931348623157E308
		wirelessFeTransmitterGpCostPerConnection = 1.0

[watering_can]
	#Whether the Watering Can should be broken when used by a fake player.
	isWateringCanBreakable = true
	#The radius in blocks around the player that the Watering Can will effect.
	# Default: 3
	# Range: > 1
	wateringCanRadius = 3
	#The chance that each block in the radius will get ticked when the Watering Can is used.
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	wateringCanTickChance = 0.3
	#The amount of water in millibuckets that the Watering Can will use per tick.
	#Setting this to 0 will make it not require water at all.
	# Default: 10
	# Range: > 0
	wateringCanWaterUsagePerTick = 10
	#The radius in blocks around the player that the Reinforced Watering Can will effect.
	# Default: 5
	# Range: > 1
	reinforcedWateringCanRadius = 5
	#The chance that each block in the radius will get ticked when the Reinforced Watering Can is used.
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	reinforcedWateringCanTickChance = 0.5
	#The amount of water in millibuckets that the Reinforced Watering Can will use per tick.
	#Setting this to 0 will make it not require water at all.
	# Default: 10
	# Range: > 0
	reinforcedWateringCanWaterUsagePerTick = 0

	#GP costs are defined elsewhere!
	[rings.chicken_wing_ring]
		#The max fall speed when using a Chicken Wing Ring.
