		# Range: > 1
		chickenWingRingDurationTicks = 200
		#The number of ticks that the Chicken Wing Ring will take to fully recharge.
		# Default: 100
		# Range: > 1
		chickenWingRingRechargeTicks = 100

	[rings.flying_squid_ring]
		#How many times stronger than your gravity the upward thrust of the Ring of the Flying Squid is.
		# Default: 1.1
		# Range: 0.0 ~ 1.7976931348623157E308
		flyingSquidRingThrustMultiplier = 1.1
		#The maximum upward speed in blocks per tick that the Ring of the Flying Squid will push you.
		# Default: 1.0
		# Range: 0.0 ~ 1.7976931348623157E308
		flyingSquidRingMaxUpwardSpeed = 1.0
		#The number of ticks that the Ring of the Flying Squid will last.
		# Default: 300
		# Range: > 1
		flyingSquidRingDurationTicks = 300
		#The number of ticks that the Ring of the Flying Squid will take to fully recharge.
		# Default: 200
		# Range: > 1
		flyingSquidRingRechargeTicks = 200
